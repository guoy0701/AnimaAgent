[project]
name = "anima-agent"
version = "0.2.0"
description = "有灵魂的AI Agent框架"
requires-python = ">=3.10"
dependencies = [
    "jieba>=0.42",
]

[project.optional-dependencies]
semantic = [
    "anthropic>=0.49",
    "voyageai>=0.3",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
