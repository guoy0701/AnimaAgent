[project]
name = "anima-agent"
version = "0.2.0"
description = "AI Agent Personality Framework — Agents are not tools, they are people"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AnimaAgent Team", email = "guoy0701@gmail.com"},
]
keywords = ["ai", "agent", "personality", "memory", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jieba>=0.42",
    "mcp>=1.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.49",
    "voyageai>=0.3",
]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/guoy0701/AnimaAgent"
Repository = "https://github.com/guoy0701/AnimaAgent"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anima*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
